# --- Concurrency & Retry Performance Tuning ---
# Max concurrent phone checks processed in parallel
checker.concurrency.limit=3

# HTTP/REST API connection timeouts (in seconds)
checker.api.timeout.connect=10
checker.api.timeout.read=30

# API Call Retries (exponential backoff with jitter)
checker.api.max.retries=3
checker.api.retry.delay.ms=1000

